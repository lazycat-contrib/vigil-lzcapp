# Vigil configuration for the LazyCat community package.
#
# Upstream's sample ships placeholder manager/reporter tokens and points the
# branding at the vendor's own status page; both are replaced here. The node
# list below is a single local self-check so the page renders out of the box —
# replace it with your own services after installing.

[server]

log_level = "error"
inet = "0.0.0.0:8080"
workers = 4

mcp_server = false

# Rendered from deployment parameters at container start.
manager_token = "__VIGIL_MANAGER_TOKEN__"
reporter_token = "__VIGIL_REPORTER_TOKEN__"

[assets]

path = "./res/assets/"

[branding]

page_title = "Service Status"
page_url = "/"
company_name = "Status"
icon_color = "#1972F5"
icon_url = ""
logo_color = "#1972F5"
logo_url = ""
website_url = "/"
support_url = "/"
custom_html = ""

[metrics]

poll_interval = 120
poll_retry = 2
poll_retry_wait = 500

poll_http_status_healthy_above = 200
poll_http_status_healthy_below = 400

poll_delay_dead = 10
poll_delay_sick = 5

poll_parallelism = 4

push_delay_dead = 20

push_system_cpu_sick_above = 0.90
push_system_ram_sick_above = 0.90

script_interval = 300

script_parallelism = 2

local_delay_dead = 40

[plugins]

[notify]

startup_notification = false
reminder_interval = 300
reminder_backoff_function = "linear"
reminder_backoff_limit = 3
reminder_escalate = false

# Example node: this app polling its own status page. Replace with your services.
[node:local-self-check]
url = "http://127.0.0.1:8080/"
interval = 120
retries = 1

[service:self-check]
name = "Vigil self check"
replicas = [
  "node:local-self-check"
]
